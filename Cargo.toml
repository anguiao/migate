[package]
name = "migate"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
event-listener = "5"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
isahc = { version = "2", default-features = false, features = ["rustls-tls-webpki-roots"] }
rcgen = "0.14"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha1 = "0.11"
time = { version = "0.3", features = ["formatting"] }
url = "2"
x509-parser = "0.18"

futures-lite = "2"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
futures-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
mqttbytes = "0.6"
mdns-sd = "0.21.3"
bytes = "1"
async-io = "2"
rand = "0.10"
rs-matter = { version = "0.4.1", features = ["astro-dnssd", "groups", "persistent-subscriptions"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
log = "0.4"
blocking = "1"
async-signal = "0.2"
env_logger = "0.11"

[dev-dependencies]
flume = { version = "0.12", default-features = false, features = ["async"] }
if-addrs = "0.15"
rcgen = { version = "0.14", features = ["x509-parser"] }
sha2 = "0.11"
tempfile = "3"
x509-parser = { version = "0.18", features = ["verify"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true
