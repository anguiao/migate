[package]
name = "migate"
version = "0.1.0"
edition = "2024"

[dependencies]
event-listener = "5"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
isahc = { version = "2", default-features = false, features = ["rustls-tls-webpki-roots"] }
rcgen = "0.14"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha1 = "0.11"
time = { version = "0.3", features = ["formatting"] }
url = "2"
x509-parser = "0.18"

futures-lite = "2"
futures-util = "0.3"
async-io = "2"
async-process = "2"
rand = "0.10"
rs-matter = { git = "https://github.com/project-chip/rs-matter.git", rev = "ca16b0ca3c3776272d5fa7aa3693501882ec41a3", features = ["astro-dnssd", "groups", "persistent-subscriptions"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
log = "0.4"
blocking = "1"
async-signal = "0.2"
env_logger = "0.11"
if-addrs = "0.15"
libc = "0.2"
mdns-sd = "0.21"
flume = "0.12"
socket2 = { version = "0.6.5", features = ["all"] }
bytes = "1"
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["block-padding"] }
md-5 = "0.11.0"
subtle = "2.6.1"

[dev-dependencies]
mqttbytes = "0.6"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
sha2 = "0.11"
tempfile = "3"
x509-parser = { version = "0.18", features = ["verify"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true
