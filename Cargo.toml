[package]
name = "migate"
version = "0.1.0"
edition = "2024"

[dependencies]
event-listener = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

futures-lite = "2"
async-io = "2"
rand = "0.10"
rs-matter = { git = "https://github.com/project-chip/rs-matter.git", rev = "ca16b0ca3c3776272d5fa7aa3693501882ec41a3", features = ["astro-dnssd", "groups", "persistent-subscriptions"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
log = "0.4"
blocking = "1"
async-signal = "0.2"
env_logger = "0.11"
